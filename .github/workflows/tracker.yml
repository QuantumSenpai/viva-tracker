name: Tracker
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths: [students.txt]
  issues:
    types: [edited]
permissions:
  contents: write
  issues: write
jobs:
  sync:
    if: github.event_name != 'issues'
    concurrency: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const IGNORE = new Set(['md', 'txt', 'png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'ico', 'pdf', 'doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx', 'csv', 'zip', 'rar', '7z', 'tar', 'gz', 'exe', 'out', 'o', 'obj', 'class', 'dll', 'so', 'a', 'lib', 'jar', 'log', 'yml', 'yaml', 'json', 'lock', 'toml', 'ini', 'cfg', 'gitignore', 'gitattributes']);
            const SKIP = new Set(['node_modules', 'venv', 'env', '__pycache__', 'build', 'dist', 'bin', 'obj', 'vendor', 'target', 'out']);
            const pick = paths => {
              let prefix = '';
              for (let depth = 0; ; depth++) {
                const names = new Set();
                for (const p of paths) {
                  if (!p.startsWith(prefix)) continue;
                  const parts = p.slice(prefix.length).split('/');
                  const dirs = parts.slice(0, -1);
                  const file = parts[parts.length - 1];
                  const ext = file.includes('.') ? file.split('.').pop().toLowerCase() : '';
                  if (!ext || IGNORE.has(ext) || file.startsWith('.') || dirs.some(d => d.startsWith('.') || SKIP.has(d))) continue;
                  names.add(dirs.length ? dirs[0] : file);
                }
                const list = [...names];
                const onlyDir = list.length === 1 && paths.some(p => p.startsWith(prefix + list[0] + '/'));
                if (onlyDir && depth < 2) {
                  prefix += list[0] + '/';
                  continue;
                }
                return list
                  .sort((x, y) => x.localeCompare(y, undefined, { numeric: true }))
                  .map(x => prefix + x);
              }
            };
            const render = (dirs, done) => {
              const n = dirs.filter(d => done.has(d)).length;
              const t = dirs.length;
              const p = t ? Math.round(n / t * 100) : 0;
              const bar = '█'.repeat(Math.round(p / 5)).padEnd(20, '░');
              const list = dirs.map(d => `- [${done.has(d) ? 'x' : ' '}] ${d}`).join('\n');
              return `**${n} / ${t} done (${p}%)**\n\`${bar}\`\n\n${list}`;
            };
            const students = fs.readFileSync('students.txt', 'utf8').split('\n').map(s => s.trim()).filter(s => s && !s.startsWith('#'));
            const log = fs.existsSync('progress.json') ? JSON.parse(fs.readFileSync('progress.json', 'utf8')) : {};
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 });
            for (const s of students) {
              const [owner, repo] = s.split('/');
              let paths;
              try {
                const { data } = await github.rest.git.getTree({ owner, repo, tree_sha: 'HEAD', recursive: 'true' });
                if (data.truncated) core.warning(`large repo, list may be partial: ${s}`);
                paths = data.tree.filter(i => i.type === 'blob').map(i => i.path);
              } catch (e) {
                core.warning(`skip ${s}`);
                continue;
              }
              const dirs = pick(paths);
              if (!dirs.length) {
                core.warning(`no code found: ${s}`);
                continue;
              }
              const found = issues.find(i => i.title === s && !i.pull_request);
              const existing = found ? (await github.rest.issues.get({ ...context.repo, issue_number: found.number })).data : null;
              const done = new Set(Object.keys(log[s] || {}));
              if (existing && existing.body) {
                for (const m of existing.body.matchAll(/- \[x\] (.+)/gi)) done.add(m[1].trim());
              }
              const body = render(dirs, done);
              if (!existing) {
                await github.rest.issues.create({ ...context.repo, title: s, body });
              } else if (existing.body.replace(/\r\n/g, '\n') !== body) {
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
              }
            }
  log:
    if: github.event_name == 'issues' && !github.event.issue.pull_request && github.event.changes.body && contains(github.event.issue.title, '/')
    runs-on: ubuntu-latest
    concurrency:
      group: log-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const key = context.payload.issue.title;
            const who = context.payload.sender.login;
            const now = new Date();
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: context.payload.issue.number });
            const lines = issue.body.split('\n').map(l => l.replace(/\r$/, '')).filter(l => /^- \[[ x]\] /i.test(l));
            const checked = lines.filter(l => /^- \[x\]/i.test(l)).map(l => l.replace(/^- \[x\] /i, '').trim());
            const t = lines.length;
            const n = checked.length;
            const p = t ? Math.round(n / t * 100) : 0;
            const bar = '█'.repeat(Math.round(p / 5)).padEnd(20, '░');
            const body = `**${n} / ${t} done (${p}%)**\n\`${bar}\`\n\n${lines.join('\n')}`;
            if (body !== issue.body.replace(/\r\n/g, '\n')) {
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body });
            }
            const ist = now.toLocaleString('en-IN', {
              timeZone: 'Asia/Kolkata',
              day: '2-digit', month: 'short', year: 'numeric',
              hour: '2-digit', minute: '2-digit', hour12: true
            });
            for (let i = 0; i < 3; i++) {
              let sha;
              let log = {};
              try {
                const { data } = await github.rest.repos.getContent({ ...context.repo, path: 'progress.json' });
                sha = data.sha;
                log = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              } catch (e) {}
              const cur = log[key] || {};
              const added = checked.filter(q => !cur[q]);
              const removed = Object.keys(cur).filter(q => !checked.includes(q));
              if (!added.length && !removed.length) return;
              const next = {};
              for (const q of checked) next[q] = cur[q] || { by: who, at: now.toISOString() };
              log[key] = next;
              const parts = [];
              if (added.length) parts.push(added.join(', ') + ' ticked');
              if (removed.length) parts.push(removed.join(', ') + ' unticked');
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  ...context.repo,
                  path: 'progress.json',
                  message: `${key}: ${parts.join(' | ')} by ${who} at ${ist} IST`,
                  content: Buffer.from(JSON.stringify(log, null, 2) + '\n').toString('base64'),
                  sha
                });
                return;
              } catch (e) {
                if (e.status !== 409 && e.status !== 422) throw e;
              }
            }