name: Tracker
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths: [students.txt]
  issues:
    types: [edited]
permissions:
  contents: write
  issues: write
jobs:
  sync:
    if: github.event_name != 'issues'
    concurrency: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const render = (dirs, done) => {
              const n = dirs.filter(d => done.has(d)).length;
              const t = dirs.length;
              const p = t ? Math.round(n / t * 100) : 0;
              const bar = '█'.repeat(Math.round(p / 5)).padEnd(20, '░');
              const list = dirs.map(d => `- [${done.has(d) ? 'x' : ' '}] ${d}`).join('\n');
              return `**${n} / ${t} done (${p}%)**\n\`${bar}\`\n\n${list}`;
            };
            const students = fs.readFileSync('students.txt', 'utf8').split('\n').map(s => s.trim()).filter(s => s && !s.startsWith('#'));
            const log = fs.existsSync('progress.json') ? JSON.parse(fs.readFileSync('progress.json', 'utf8')) : {};
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 });
            for (const s of students) {
              const [owner, repo] = s.split('/');
              let items;
              try {
                ({ data: items } = await github.rest.repos.getContent({ owner, repo, path: '' }));
              } catch (e) {
                core.warning(`skip ${s}`);
                continue;
              }
              const dirs = items
                .filter(i => i.type === 'dir' && !i.name.startsWith('.'))
                .map(i => i.name)
                .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
              const existing = issues.find(i => i.title === s && !i.pull_request);
              const done = new Set(Object.keys(log[s] || {}));
              if (existing && existing.body) {
                for (const m of existing.body.matchAll(/- \[x\] (.+)/gi)) done.add(m[1].trim());
              }
              const body = render(dirs, done);
              if (!existing) {
                await github.rest.issues.create({ ...context.repo, title: s, body });
              } else if (existing.body !== body) {
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
              }
            }
  log:
    if: github.event_name == 'issues' && !github.event.issue.pull_request && github.event.changes.body && contains(github.event.issue.title, '/')
    runs-on: ubuntu-latest
    concurrency:
      group: log-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const key = issue.title;
            const who = context.payload.sender.login;
            const now = new Date();
            const lines = issue.body.split('\n').filter(l => /^- \[[ x]\] /i.test(l));
            const checked = lines.filter(l => /^- \[x\]/i.test(l)).map(l => l.replace(/^- \[x\] /i, '').trim());
            const t = lines.length;
            const n = checked.length;
            const p = t ? Math.round(n / t * 100) : 0;
            const bar = '█'.repeat(Math.round(p / 5)).padEnd(20, '░');
            await github.rest.issues.update({
              ...context.repo,
              issue_number: issue.number,
              body: `**${n} / ${t} done (${p}%)**\n\`${bar}\`\n\n${lines.join('\n')}`
            });
            const ist = now.toLocaleString('en-IN', {
              timeZone: 'Asia/Kolkata',
              day: '2-digit', month: 'short', year: 'numeric',
              hour: '2-digit', minute: '2-digit', hour12: true
            });
            for (let i = 0; i < 3; i++) {
              let sha;
              let log = {};
              try {
                const { data } = await github.rest.repos.getContent({ ...context.repo, path: 'progress.json' });
                sha = data.sha;
                log = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              } catch (e) {}
              const cur = log[key] || {};
              const added = checked.filter(q => !cur[q]);
              const removed = Object.keys(cur).filter(q => !checked.includes(q));
              if (!added.length && !removed.length) return;
              const next = {};
              for (const q of checked) next[q] = cur[q] || { by: who, at: now.toISOString() };
              log[key] = next;
              const parts = [];
              if (added.length) parts.push(added.join(', ') + ' ticked');
              if (removed.length) parts.push(removed.join(', ') + ' unticked');
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  ...context.repo,
                  path: 'progress.json',
                  message: `${key}: ${parts.join(' | ')} by ${who} at ${ist} IST`,
                  content: Buffer.from(JSON.stringify(log, null, 2) + '\n').toString('base64'),
                  sha
                });
                return;
              } catch (e) {
                if (e.status !== 409 && e.status !== 422) throw e;
              }
            }